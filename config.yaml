mappings:
- api_endpoint: /users
  columns:
    email: user_email
    id: user_id
    name: user_name
  query: SELECT id, name, email FROM users;
- api_endpoint: /orders
  columns:
    id: order_id
    status: order_status
    total_price: amount
    user_id: customer_id
  query: SELECT id, user_id, status FROM orders;
- api_endpoint: /products
  columns:
    id: product_id
    name: product_name
    price: product_price
    stock: inventory_count
  query: SELECT id, name, price, stock FROM products;
- api_endpoint: /categories
  columns:
    description: category_description
    id: category_id
    name: category_name
  query: SELECT id, name, description FROM categories;
